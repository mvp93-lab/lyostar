version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/database/schema.sql"
    queries: "internal/database/queries.sql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        output_db_file_name: "db_gen.go"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
