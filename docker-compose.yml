services:
  lyostar:
    image: lyostar:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: lyostar
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount your ebook collection (STRICTLY READ-ONLY)
      - ./books:/books:ro
      # Application data: SQLite database (app.db), covers cache, and uploads
      - ./data:/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
